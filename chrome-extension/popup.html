<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facebook Bulk Unfollow</title>
    <style>
      body { width: 280px; margin: 0; padding: 16px; color: #1c1e21; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      #stats { color: #65676b; }
      #status { min-height: 40px; margin: 12px 0; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #1877f2; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button.pause { background: #c5221f; }
      .hint { margin: 12px 0 0; color: #65676b; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Bulk Unfollow</h1>
    <div id="stats">Loading…</div>
    <div id="status"></div>
    <button id="toggle" type="button">Loading…</button>
    <p class="hint">Open your Facebook Following page before starting.</p>
    <script src="popup.js"></script>
  </body>
</html>
